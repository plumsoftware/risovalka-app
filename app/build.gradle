plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 36
    namespace 'com.plumsoftware.risovalka'

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")

    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }

    def mainBannerAdsId = localProperties.getProperty("mainScreenBannerAdsId")
    def openAdsId = localProperties.getProperty("openAdsId")
    def interstitialAdsId = localProperties.getProperty("interstitialAdsId")
    def rewardedAdsId = localProperties.getProperty("rewardedAdsId")

    defaultConfig {
        applicationId "com.plumsoftware.risovalka"
        minSdk 25
        targetSdk 36
        versionCode 31
        versionName "3.1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "mainScreenBannerAdsId", "\"${mainBannerAdsId}\""
        buildConfigField "String", "openAdsId", "\"${openAdsId}\""
        buildConfigField "String", "interstitialAdsId", "\"${interstitialAdsId}\""
        buildConfigField "String", "rewardedAdsId", "\"${rewardedAdsId}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.firebase:firebase-analytics:23.0.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    //Painter
//    implementation 'com.kyanogen.signatureview:signature-view:1.2'
    implementation 'com.github.gcacace:signature-pad:1.3.1'


    //Permissions
    implementation 'com.karumi:dexter:6.2.3'

    //Color picker
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    //Ads
    //noinspection PlayServiceAdsVersion
    //implementation 'com.google.android.gms:play-services-ads:21.4.0'

    //Glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'

    //Yandex ads
    implementation 'com.yandex.android:mobileads:8.1.0'
}